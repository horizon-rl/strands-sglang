[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "strands-sglang"
dynamic = ["version"]
description = "SGLang model provider of Strands Agents for on-policy agentic RL training."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Yuan He", email = "yuanhe.cs.ai@gmail.com" }
]
keywords = ["strands", "agents", "sglang", "llm", "ai", "reinforcement-learning", "rl", "agentic-rl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "strands-agents[openai]>=1.46.0",
    "aiohttp>=3.13",
    "transformers>=5.6.0",
    "jinja2",
    "pybase64",
]

[project.urls]
Homepage = "https://github.com/strands-rl/strands-sglang/"
Documentation = "https://github.com/strands-rl/strands-sglang/#readme"
Repository = "https://github.com/strands-rl/strands-sglang/"
Issues = "https://github.com/strands-rl/strands-sglang/issues"

# PEP 735. Deliberately not `[project.optional-dependencies].dev`: dev tooling is
# not a feature users can install, and it stays out of the published metadata.
[dependency-groups]
dev = [
    "build>=1.3",
    "mypy>=1.19",
    "pre-commit>=4.5",
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7",
    "pytest-mock>=3.15",
    "pytest-timeout>=2.4",
    "ruff>=0.16",
    "tiktoken>=0.12",
    "twine>=6.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_sglang"]

# An allowlist, not an exclude list: hatchling reads the filesystem rather than git,
# so anything untracked but present would otherwise ship.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 90
# A dependency's deprecation must fail the suite, not scroll past it.
filterwarnings = ["error"]
markers = [
    "integration: tests that require a running SGLang server",
    "chat_template: tests against real HuggingFace tokenizers (requires network on first run)",
]

[tool.coverage.run]
source = ["src/strands_sglang"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "@(typing\\.)?overload",
    "class .*\\bProtocol\\):",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D2",     # pydocstyle formatting — D1 (must exist) is deliberately not selected
    "D4",     # pydocstyle content
    "E",      # pycodestyle
    "F",      # pyflakes
    "G",      # flake8-logging-format
    "I",      # isort
    "LOG",    # logging
    "N",      # pep8-naming
    "PIE",    # flake8-pie
    "RUF006", # unowned asyncio task — a dropped task loses a rollout silently
    "RUF012", # mutable class attr without ClassVar
    "RUF100", # unused noqa
    "SIM",    # flake8-simplify
    "TRY201", # verbose raise
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"!src/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["strands_sglang"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
# Every dependency here ships types, so nothing needs waving through. A stubless one
# would get a named [[tool.mypy.overrides]] entry rather than a global pass.
ignore_missing_imports = false
follow_untyped_imports = true

[tool.codespell]
skip = "*.json,*.jsonl"
