[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "strands-sglang"
dynamic = ["version"]
description = "SGLang model provider for Strands Agents SDK with Token-in/Token-out support for agentic RL training."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Yuan He", email = "yuanhe.cs.ai@gmail.com" }
]
keywords = ["strands", "agents", "sglang", "llm", "ai", "reinforcement-learning", "rl", "agentic-rl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "strands-agents>=1.46.0",
    "aiohttp>=3.8.0",
    "transformers>=5.6.0",
    "jinja2",
    "pybase64",
]

[project.urls]
Homepage = "https://github.com/strands-rl/strands-sglang/"
Documentation = "https://github.com/strands-rl/strands-sglang/#readme"
Repository = "https://github.com/strands-rl/strands-sglang/"
Issues = "https://github.com/strands-rl/strands-sglang/issues"

# PEP 735. Deliberately not `[project.optional-dependencies].dev`: dev tooling is
# not a feature users can install, and it stays out of the published metadata.
[dependency-groups]
dev = [
    "build>=0.10.0",
    "mypy>=1.15.0,<3.0.0",
    "pre-commit",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "pytest-timeout>=2.0.0",
    "ruff>=0.16.0",
    "strands-agents[openai]",
    "tiktoken>=0.5.0",
    "twine>=4.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_sglang"]

# An allowlist, not an exclude list: hatchling reads the filesystem rather than git,
# so anything untracked but present would otherwise ship.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 90
markers = [
    "integration: tests that require a running SGLang server",
    "chat_template: tests against real HuggingFace tokenizers (requires network on first run)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "D", "E", "F", "G", "I", "LOG", "N", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"!src/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unreachable = true
ignore_missing_imports = true

[tool.codespell]
skip = "*.json,*.jsonl"
